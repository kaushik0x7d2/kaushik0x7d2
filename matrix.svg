      .sub{font-family:'JetBrains Mono','Fira Code','Courier New',monospace;fill:#00FF00;font-size:14px;opacity:.7}
      .cur{animation:blink .7s step-end infinite;fill:#00FF00}
      .l1{animation:fade1 12s linear infinite}
      .l2{animation:fade2 12s linear infinite}
      .l3{animation:fade3 12s linear infinite}
      .l4{animation:fade4 12s linear infinite}
