<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; fill: #00FF00; font-size: 14px; }
      .dim { opacity: 0.3; }
      .mid { opacity: 0.6; }
      .bright { opacity: 1; }
      @keyframes rain1 { 0% { transform: translateY(-200px); } 100% { transform: translateY(220px); } }
      @keyframes rain2 { 0% { transform: translateY(-180px); } 100% { transform: translateY(240px); } }
      @keyframes rain3 { 0% { transform: translateY(-220px); } 100% { transform: translateY(200px); } }
      @keyframes rain4 { 0% { transform: translateY(-160px); } 100% { transform: translateY(260px); } }
      @keyframes rain5 { 0% { transform: translateY(-240px); } 100% { transform: translateY(180px); } }
      @keyframes glow { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
      .r1 { animation: rain1 3.0s linear infinite; }
      .r2 { animation: rain2 3.5s linear infinite; }
      .r3 { animation: rain3 2.8s linear infinite; }
      .r4 { animation: rain4 4.0s linear infinite; }
      .r5 { animation: rain5 3.2s linear infinite; }
      .r6 { animation: rain1 2.5s linear infinite; }
      .r7 { animation: rain2 4.2s linear infinite; }
      .r8 { animation: rain3 3.7s linear infinite; }
      .r9 { animation: rain4 2.9s linear infinite; }
      .r10 { animation: rain5 3.4s linear infinite; }
      .r11 { animation: rain1 4.5s linear infinite; }
      .r12 { animation: rain2 2.6s linear infinite; }
